<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выдача МИ в ЛУ</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    background: #f5f6f8;
    color: #222;
    max-width: 500px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: 600;
  }
  #btnPhoto { background: #2fc6f6; color: #fff; }
  #btnGallery { background: #7a8bff; color: #fff; }
  #btnSend { background: #1db954; color: #fff; }
  button:disabled { opacity: 0.6; }

  #photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .photo-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #e5e7eb;
    aspect-ratio: 1 / 1;
  }
  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-item .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    margin: 0;
    cursor: pointer;
    font-weight: 700;
  }
  #info { margin-top: 8px; font-size: 13px; color: #666; }
  #status {
    margin-top: 16px; padding: 12px; border-radius: 8px;
    font-size: 14px; display: none; white-space: pre-wrap;
  }
  .ok { background: #d4f5dd; color: #10622a; }
  .err { background: #fad4d4; color: #7a1414; }
</style>
</head>
<body>

<h1>Выдача МИ в ЛУ</h1>

<label for="dealId">ID сделки</label>
<input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345">

<label>Фото (до 3 штук, каждое до 300 КБ)</label>
<button id="btnPhoto" type="button">📷 Сделать фото</button>
<button id="btnGallery" type="button">🖼 Выбрать из галереи</button>
<div id="photos"></div>
<div id="info"></div>

<label for="comment">Комментарий</label>
<textarea id="comment" placeholder="Введите текст комментария"></textarea>

<button id="btnSend" type="button">Отправить в Битрикс24</button>

<div id="status"></div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/0v15olo1zki4ls1k/";
const PORTAL = "https://b24-964ige.bitrix24.ru";
const MANAGER_ID = "1"; // ID сотрудника для уведомления
const MAX_SIZE = 300 * 1024;
const MAX_PHOTOS = 3;
const FIXED_PHRASE = "Выдача МИ в ЛУ";

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const btnPhoto = $("btnPhoto");
const btnGallery = $("btnGallery");
const btnSend = $("btnSend");
const photosEl = $("photos");
const info = $("info");
const status = $("status");

// Массив фото: [{ base64, name, size }]
let photos = [];

// Флаг обработки: блокирует кнопки, пока идёт сжатие
let isProcessing = false;

// ==== ВЫБОР ФОТО ====
// useCamera = true  → камера (capture="environment")
// useCamera = false → системный выбор (галерея / файлы)
function pickPhoto(useCamera) {
  if (isProcessing) return;

  if (photos.length >= MAX_PHOTOS) {
    info.textContent = `Достигнут лимит: ${MAX_PHOTOS} фото`;
    return;
  }

  // Пересоздаём input — лечит «залипание» камеры на iOS/Android
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment";
  input.style.display = "none";

  input.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    if (!file) {
      input.remove();
      return;
    }

    // Блокируем кнопки на время обработки — исключает гонку кликов
    isProcessing = true;
    btnPhoto.disabled = true;
    btnGallery.disabled = true;
    info.textContent = "Обработка фото...";

    try {
      const { base64, size, name } = await compressImage(file);
      photos.push({ base64, name, size });
      renderPhotos();
      info.textContent = `Добавлено: ${name}, ~${Math.round(size / 1024)} КБ. Всего: ${photos.length} из ${MAX_PHOTOS}`;
    } catch (err) {
      console.error(err);
      info.textContent = "Ошибка обработки фото: " + err.message;
    } finally {
      isProcessing = false;
      btnPhoto.disabled = false;
      btnGallery.disabled = false;
      input.remove();
    }
  });

  document.body.appendChild(input);
  input.click();
}

btnPhoto.addEventListener("click", () => pickPhoto(true));
btnGallery.addEventListener("click", () => pickPhoto(false));

function renderPhotos() {
  photosEl.innerHTML = "";
  photos.forEach((p, idx) => {
    const div = document.createElement("div");
    div.className = "photo-item";

    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.base64;
    div.appendChild(img);

    const btn = document.createElement("button");
    btn.className = "remove";
    btn.type = "button";
    btn.textContent = "×";
    btn.title = "Удалить фото";
    btn.addEventListener("click", () => {
      photos.splice(idx, 1);
      renderPhotos();
      info.textContent = `Фото удалено. Осталось: ${photos.length} из ${MAX_PHOTOS}`;
    });
    div.appendChild(btn);

    photosEl.appendChild(div);
  });
}

// Сжатие изображения через canvas
function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();

  if (!dealId) return showStatus("Укажите ID сделки", false);
  if (!comment && photos.length === 0) {
    return showStatus("Добавьте комментарий или хотя бы одно фото", false);
  }
  if (isProcessing) {
    return showStatus("Дождитесь окончания обработки фото", false);
  }

  btnSend.disabled = true;
  showStatus("Отправка...", true);

  try {
    const fullComment = comment
      ? FIXED_PHRASE + "\n" + comment
      : FIXED_PHRASE;

    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };

    if (photos.length > 0) {
      fields.FILES = photos.map(p => [p.name, p.base64]);
    }

    // 1) Добавляем комментарий в таймлайн сделки
    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });

    const data = await resp.json();

    if (data.error) {
      showStatus("Ошибка Битрикс24: " + data.error_description, false);
      return;
    }

    // 2) Отправляем уведомление сотруднику
    const dealLink = `${PORTAL}/crm/deal/details/${dealId}/`;
    const notifyText = `МИ выдано.\nСделка: ${dealLink}`;

    let notifyNote = "";
    try {
      const notifyResp = await fetch(WEBHOOK + "im.message.add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          DIALOG_ID: MANAGER_ID,
          MESSAGE: notifyText,
          URL_PREVIEW: "Y"
        })
      });
      const notifyData = await notifyResp.json();
      if (notifyData.error) {
        console.warn("Не удалось отправить уведомление:", notifyData.error_description);
        notifyNote = `\n⚠️ Уведомление не отправлено: ${notifyData.error_description}`;
      }
    } catch (e) {
      console.warn("Ошибка отправки уведомления:", e);
      notifyNote = `\n⚠️ Уведомление не отправлено: ${e.message}`;
    }

    showStatus("✅ Комментарий добавлен в сделку " + dealId + notifyNote, true);

    // Сброс формы
    photos = [];
    renderPhotos();
    info.textContent = "";
    $("comment").value = "";

  } catch (err) {
    console.error(err);
    showStatus("Сетевая ошибка: " + err.message, false);
  } finally {
    btnSend.disabled = false;
  }
});

function showStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? "ok" : "err";
  status.style.display = "block";
}
</script>

</body>
</html>
