<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выдача МИ в ЛУ · ГрандМедТех</title>

<link rel="icon" href="https://mironov62-svg.github.io/SID_DSH/assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700%7CPoppins:400,500,600,700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --phone: #ffad00;
    --violet: #9e43fa;
    --violet-2: #a044ff;
    --success: #459647;
    --warn: #f5a623;
    --danger: #e5484d;
    --bg: #101010;
    --bg-panel: rgba(0, 0, 0, 0.45);
    --bg-panel-2: #17151c;
    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.78);
    --text-muted: rgba(255, 255, 255, 0.55);
    --border: rgba(255, 255, 255, 0.12);
    --radius-xl: 15px;
    --radius-md: 8px;
    --radius-lg: 10px;

    --grad-header: linear-gradient(272deg, rgb(84, 99, 130) 0%, rgb(92, 66, 131) 98%);
    --grad-btn: linear-gradient(to right, #6a3093 0%, #a044ff 51%, #6a3093 100%);

    --box-glow: rgb(119 54 222) -1px 11px 35px -20px, rgb(152 62 212) 1px 1px 20px -30px;
    --transition: all 0.3s ease;
  }

  body {
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 14px;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(106, 48, 147, 0.4) 0%, transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 15px 20px;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    backdrop-filter: blur(10px);
    box-shadow: var(--box-glow);
    overflow: visible;
  }

  /* ШАПКА — сжата по горизонтали, всегда одна строка */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    background: var(--grad-header);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .site-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    min-width: 0;
    flex-shrink: 1;
  }

  .site-logo img {
    height: 30px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  .site-logo-text {
    min-width: 0;
    overflow: hidden;
  }

  .site-logo-text b {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    display: block;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .site-logo-text span {
    font-size: 9px;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .site-contacts {
    text-align: right;
    flex-shrink: 0;
  }

  .site-contacts a {
    display: block;
    text-decoration: none;
    color: #fff;
    line-height: 1.15;
    white-space: nowrap;
  }

  .site-phone {
    color: var(--phone);
    font-weight: 600;
    font-size: 12px;
  }

  .site-mail {
    font-size: 10px;
    opacity: 0.9;
  }

  /* ЗАГОЛОВОК */
  .header-block {
    padding: 12px 20px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .header-block h2 {
    font-size: 19px;
    color: #fff;
    font-weight: 600;
  }

  .content { padding: 18px 24px 24px; }

  /* ФОРМА */
  .form-section {
    margin-bottom: 14px;
    padding: 14px 18px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
  }

  .form-section h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }

  label {
    display: block;
    font-weight: 500;
    margin: 8px 0 5px;
    font-size: 12px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 9px 12px;
    background: #fff;
    border: 1px solid rgba(158, 67, 250, 0.3);
    border-radius: var(--radius-md);
    font-size: 14px;
    color: #333;
    font-family: 'Montserrat', Arial, sans-serif;
    transition: var(--transition);
  }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--violet);
    box-shadow: 0 0 0 2px rgba(158, 67, 250, 0.2);
  }

  input#dealId.ok {
    border-color: #459647;
    box-shadow: 0 0 0 2px rgba(69, 150, 71, 0.3);
  }
  input#dealId.err {
    border-color: #e5484d;
    box-shadow: 0 0 0 2px rgba(229, 72, 77, 0.3);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  #dealHint {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.3;
    min-height: 16px;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  #dealHint.err  { color: #ff9ea8; font-weight: 600; }
  #dealHint.ok   { color: #a8e6b0; font-weight: 600; }
  #dealHint.warn { color: #ffd98a; }

  /* КНОПКИ — единый стиль */
  .button-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-lg);
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.4px;
    transition: var(--transition);
    font-family: 'Montserrat', Arial, sans-serif;
    background: var(--grad-btn);
    background-size: 200%;
    color: white;
    box-shadow: 0 4px 15px rgba(160, 68, 255, 0.3);
  }

  button:hover:not(:disabled) { background-position: right; }

  button:disabled { opacity: 0.6; cursor: not-allowed; }

  #info {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ФОТО */
  #photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .photo-item {
    position: relative;
    padding-top: 100%;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #222;
    border: 1px solid var(--border);
  }
  .photo-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-item .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 14px;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    flex: none;
    text-transform: none;
    letter-spacing: 0;
    box-shadow: none;
  }
  .photo-item .remove:hover { background: rgba(0,0,0,0.9); }

  /* ЧЕКБОКС «МИ принято» */
  #acceptRow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    transition: var(--transition);
  }
  #acceptRow:hover { background: rgba(255,255,255,0.08); }
  #acceptRow input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--warn);
    cursor: pointer;
    margin: 0;
    flex-shrink: 0;
  }
  #acceptRow.busy { opacity: 0.6; pointer-events: none; }

  /* СТАТУС */
  #statusBox {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
    border: 1px solid transparent;
  }
  #statusBox.show { display: flex; }
  #statusBox.ok {
    background: rgba(69, 150, 71, 0.15);
    color: #a8e6b0;
    border-color: rgba(69, 150, 71, 0.5);
  }
  #statusBox.err {
    background: rgba(220, 53, 69, 0.12);
    color: #ff9ea8;
    border-color: rgba(220, 53, 69, 0.5);
  }
  #statusBox.warn {
    background: rgba(245, 166, 35, 0.12);
    color: #ffd98a;
    border-color: rgba(245, 166, 35, 0.5);
  }

  #statusIcon {
    font-size: 22px;
    line-height: 1;
    flex: 0 0 auto;
    margin-top: -2px;
  }
  #statusText { white-space: pre-wrap; flex: 1; }

  .yes { color: #a8e6b0; font-weight: 700; }
  .no  { color: var(--text-muted); }

  /* АДАПТИВ */
  @media (max-width: 600px) {
    .site-header {
      flex-direction: row;
      text-align: left;
      padding: 6px 10px;
      gap: 6px;
    }

    .site-logo img { height: 26px; }
    .site-logo-text b { font-size: 11px; }
    .site-logo-text span { display: none; }

    .site-phone { font-size: 11px; }
    .site-mail { font-size: 9px; }

    .content { padding: 14px 16px 20px; }
    .form-section { padding: 12px 14px; }
  }

  @media (max-width: 380px) {
    .site-logo-text b { font-size: 10px; }
    .site-phone { font-size: 10px; }
    .site-mail { font-size: 8px; }
    .site-logo img { height: 22px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="container">

    <!-- ШАПКА -->
    <header class="site-header">
      <a class="site-logo" href="https://grandmedtech.ru/" target="_blank">
        <img src="https://mironov62-svg.github.io/SID_DSH/assets/logo.png" alt="ГрандМедТех">
        <div class="site-logo-text">
          <b>ГрандМедТех</b>
          <span>Сервис медтехники</span>
        </div>
      </a>
      <div class="site-contacts">
        <a class="site-phone" href="tel:+73833110232">8 (383) 311-02-32</a>
        <a class="site-mail" href="mailto:gmt@gmt54.ru">gmt@gmt54.ru</a>
      </div>
    </header>

    <!-- ЗАГОЛОВОК -->
    <div class="header-block">
      <h2>Выдача МИ в ЛУ</h2>
    </div>

    <div class="content">

      <!-- ID СДЕЛКИ -->
      <div class="form-section">
        <h3>📋 ID сделки</h3>
        <label for="dealId">Номер сделки в Битрикс24</label>
        <input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345" autocomplete="off">
        <div id="dealHint"></div>
      </div>

      <div id="appBody">

        <!-- ФОТО -->
        <div class="form-section">
          <h3>📷 Фотографии</h3>
          <div class="button-group">
            <button id="btnPhoto" type="button">Сделать фото</button>
            <button id="btnGallery" type="button">Из галереи</button>
          </div>
          <div id="photos"></div>
          <div id="info"></div>
        </div>

        <!-- КОММЕНТАРИЙ -->
        <div class="form-section">
          <h3>💬 Комментарий</h3>
          <label for="comment">Текст комментария</label>
          <textarea id="comment" placeholder="Введите текст комментария"></textarea>

          <label id="acceptRow" for="acceptCheck">
            <input type="checkbox" id="acceptCheck">
            <span>МИ принято</span>
          </label>
        </div>

        <!-- ОТПРАВКА -->
        <div class="button-group">

        </div>

      </div>

      <div id="statusBox">
        <div id="statusIcon"></div>
        <div id="statusText"></div>

    </div>
  </div>
</div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/0v15olo1zki4ls1k/";
const PORTAL = "https://b24-964ige.bitrix24.ru";
const MANAGER_ID = "240";
const MAX_SIZE = 300 * 1024;
const MAX_PHOTOS = 3;
const FIXED_PHRASE = "Выдача МИ в ЛУ";
const ACCEPT_FIELD = "UF_CRM_1791016249";

const CATEGORY_ID    = 12;
const REQUIRED_STAGE = "C12:UC_3M5ZEE";
const REQUIRED_STAGE_NAME = "На выдачу";
const NEXT_STAGE     = "C12:WON";
const NEXT_STAGE_NAME = "Сделка успешна";

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const dealHint = $("dealHint");
const btnPhoto = $("btnPhoto");
const btnGallery = $("btnGallery");
const btnSend = $("btnSend");
const acceptRow = $("acceptRow");
const acceptCheck = $("acceptCheck");
const photosEl = $("photos");
const info = $("info");
const statusBox = $("statusBox");
const statusIcon = $("statusIcon");
const statusText = $("statusText");

let photos = [];
let isProcessing = false;
let isAcceptBusy = false;

let stageState = null;
let checkTimer = null;

// ==== ХЕЛПЕРЫ ====
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function acceptLine(isAccepted) {
  return isAccepted
    ? `МИ принято — <span class="yes">Да</span>`
    : `МИ принято — <span class="no">Нет</span>`;
}

function setStatus(kind, html, icon) {
  if (!html) {
    statusBox.className = "";
    statusText.innerHTML = "";
    statusIcon.textContent = "";
    return;
  }
  statusBox.className = "show " + kind;
  statusIcon.textContent = icon || (kind === "ok" ? "✅" : kind === "warn" ? "⚠️" : "❗");
  statusText.innerHTML = html;
}

function setDealHint(kind, text) {
  dealIdEl.classList.remove("ok", "err");
  dealHint.classList.remove("ok", "err", "warn");

  if (kind === "ok")   dealIdEl.classList.add("ok");
  if (kind === "err")  dealIdEl.classList.add("err");

  if (kind) dealHint.classList.add(kind);
  dealHint.textContent = text || "";
}

function resetForm() {
  photos = [];
  renderPhotos();
  info.textContent = "";
  $("comment").value = "";
  acceptCheck.checked = false;
}

// ==== ПРОВЕРКА СТАДИИ ====
async function fetchDeal(dealId) {
  const resp = await fetch(WEBHOOK + "crm.deal.get", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: dealId })
  });

  let data;
  try {
    data = await resp.json();
  } catch (e) {
    throw new Error("HTTP " + resp.status + " — ответ не JSON");
  }

  if (data.error) {
    console.error("crm.deal.get error:", data);
    throw new Error(data.error_description || data.error || ("HTTP " + resp.status));
  }

  return data.result;
}

const NOT_READY_MSG = `Сделка не находится на стадии «${REQUIRED_STAGE_NAME}»`;

async function checkStage(dealId) {
  if (!dealId) {
    stageState = null;
    setDealHint("warn", "Введите ID сделки");
    setStatus("warn", "Введите ID сделки", "⚠️");
    return;
  }

  setDealHint("warn", "Проверка стадии сделки…");
  setStatus("warn", "Проверка стадии сделки…", "⏳");

  try {
    const deal = await fetchDeal(dealId);
    const categoryId = Number(deal.CATEGORY_ID);
    const stageId = deal.STAGE_ID;

    if (categoryId !== CATEGORY_ID) {
      stageState = "fail";
      const msg = `Сделка не в воронке ${CATEGORY_ID} (CATEGORY_ID=${categoryId})`;
      setDealHint("err", msg);
      setStatus("err", escapeHtml(msg), "❗");
      return;
    }

    if (stageId !== REQUIRED_STAGE) {
      stageState = "fail";
      setDealHint("err", NOT_READY_MSG);
      setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
      return;
    }

    stageState = "ok";
    acceptCheck.checked = false;

    setDealHint("ok", `Стадия «${REQUIRED_STAGE_NAME}»`);
    setStatus(
      "ok",
      `Сделка на стадии «${REQUIRED_STAGE_NAME}». Можно заполнять и отправлять.<br>${acceptLine(false)}`,
      "✅"
    );

  } catch (e) {
    stageState = "fail";
    setDealHint("err", "Ошибка: " + e.message);
    setStatus("err", "Ошибка проверки сделки: " + escapeHtml(e.message), "❗");
  }
}

dealIdEl.addEventListener("input", () => {
  stageState = null;
  setDealHint(null, "");
  setStatus("warn", "Введите ID сделки", "⚠️");

  if (checkTimer) clearTimeout(checkTimer);
  const id = dealIdEl.value.trim();
  if (!id) {
    setDealHint("warn", "Введите ID сделки");
    return;
  }

  checkTimer = setTimeout(() => checkStage(id), 700);
});

// ==== ФЛАЖОК «МИ ПРИНЯТО» ====
acceptCheck.addEventListener("change", async () => {
  const dealId = dealIdEl.value.trim();
  if (!dealId) {
    acceptCheck.checked = false;
    setStatus("warn", "Укажите ID сделки", "⚠️");
    return;
  }

  if (stageState !== "ok") {
    acceptCheck.checked = false;
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (isAcceptBusy) return;

  isAcceptBusy = true;
  acceptRow.classList.add("busy");
  setStatus("warn", "Обновление поля «МИ принято»…", "⏳");

  const value = acceptCheck.checked ? 1 : 0;

  try {
    const resp = await fetch(WEBHOOK + "crm.deal.update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: dealId,
        fields: { [ACCEPT_FIELD]: value }
      })
    });
    const data = await resp.json();
    if (data.error) {
      console.error("crm.deal.update (accept) error:", data);
      acceptCheck.checked = false;
      setStatus("err", "Ошибка Битрикс24: " + escapeHtml(data.error_description), "❗");
      return;
    }
    setStatus(
      "ok",
      `✅ Сделка ${escapeHtml(dealId)}<br>${acceptLine(acceptCheck.checked)}`,
      "✅"
    );
  } catch (err) {
    console.error(err);
    acceptCheck.checked = false;
    setStatus("err", "Сетевая ошибка: " + escapeHtml(err.message), "❗");
  } finally {
    isAcceptBusy = false;
    acceptRow.classList.remove("busy");
  }
});

// ==== ВЫБОР ФОТО ====
function pickPhoto(useCamera) {
  if (isProcessing) return;
  if (stageState !== "ok") {
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (photos.length >= MAX_PHOTOS) {
    info.textContent = `Достигнут лимит: ${MAX_PHOTOS} фото`;
    return;
  }

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment";
  input.style.display = "none";

  input.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    if (!file) {
      input.remove();
      return;
    }

    isProcessing = true;
    btnPhoto.disabled = true;
    btnGallery.disabled = true;
    info.textContent = "Обработка фото...";

    try {
      const { base64, size, name } = await compressImage(file);
      photos.push({ base64, name, size });
      renderPhotos();
      info.textContent = `Добавлено: ${name}, ~${Math.round(size / 1024)} КБ. Всего: ${photos.length} из ${MAX_PHOTOS}`;
    } catch (err) {
      console.error(err);
      info.textContent = "Ошибка обработки фото: " + err.message;
    } finally {
      isProcessing = false;
      btnPhoto.disabled = false;
      btnGallery.disabled = false;
      input.remove();
    }
  });

  document.body.appendChild(input);
  input.click();
}

btnPhoto.addEventListener("click", () => pickPhoto(true));
btnGallery.addEventListener("click", () => pickPhoto(false));

function renderPhotos() {
  photosEl.innerHTML = "";
  photos.forEach((p, idx) => {
    const div = document.createElement("div");
    div.className = "photo-item";

    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.base64;
    div.appendChild(img);

    const btn = document.createElement("button");
    btn.className = "remove";
    btn.type = "button";
    btn.textContent = "✕";
    btn.title = "Удалить фото";
    btn.addEventListener("click", () => {
      photos.splice(idx, 1);
      renderPhotos();
      info.textContent = `Фото удалено. Осталось: ${photos.length} из ${MAX_PHOTOS}`;
    });
    div.appendChild(btn);

    photosEl.appendChild(div);
  });
}

function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();
  const accepted = acceptCheck.checked;

  if (stageState !== "ok") {
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (!dealId) return setStatus("warn", "Укажите ID сделки", "⚠️");
  if (isProcessing) {
    return setStatus("warn", "Дождитесь окончания обработки фото", "⚠️");
  }

  btnSend.disabled = true;
  setStatus("warn", "Отправка...", "⏳");

  try {
    const fullComment = comment ? FIXED_PHRASE + "\n" + comment : FIXED_PHRASE;

    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };
    if (photos.length > 0) {
      fields.FILES = photos.map(p => [p.name, p.base64]);
    }

    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });
    const data = await resp.json();
    if (data.error) {
      console.error("crm.timeline.comment.add error:", data);
      setStatus("err", "Ошибка Битрикс24: " + escapeHtml(data.error_description), "❗");
      return;
    }

    const dealLink = `${PORTAL}/crm/deal/details/${dealId}/`;
    let notifyNote = "";
    try {
      const notifyResp = await fetch(WEBHOOK + "im.message.add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          DIALOG_ID: MANAGER_ID,
          MESSAGE: `МИ выдано.\nСделка: ${dealLink}`,
          URL_PREVIEW: "Y"
        })
      });
      const notifyData = await notifyResp.json();
      if (notifyData.error) {
        notifyNote = `<br>⚠️ Уведомление не отправлено: ${escapeHtml(notifyData.error_description)}`;
      }
    } catch (e) {
      notifyNote = `<br>⚠️ Уведомление не отправлено: ${escapeHtml(e.message)}`;
    }

    let stageNote = "";
    try {
      const deal = await fetchDeal(dealId);
      if (Number(deal.CATEGORY_ID) === CATEGORY_ID && deal.STAGE_ID === REQUIRED_STAGE) {
        const upd = await fetch(WEBHOOK + "crm.deal.update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: dealId,
            fields: { STAGE_ID: NEXT_STAGE }
          })
        });
        const updData = await upd.json();
        if (updData.error) {
          stageNote = `<br>⚠️ Не удалось изменить стадию: ${escapeHtml(updData.error_description)}`;
        } else {
          stageNote = `<br>Сделка переведена на стадию "${NEXT_STAGE_NAME}"`;
        }
      } else {
        stageNote = `<br>ℹ️ Стадия не изменена. ${escapeHtml(NOT_READY_MSG)}`;
      }
    } catch (e) {
      stageNote = `<br>⚠️ Не удалось изменить стадию: ${escapeHtml(e.message)}`;
    }

    resetForm();
    stageState = null;
    dealIdEl.value = "";
    setDealHint(null, "");
    setStatus(
      "ok",
      `✅ Комментарий добавлен в сделку ${escapeHtml(dealId)}` +
      `<br>${acceptLine(accepted)}` +
      notifyNote + stageNote,
      "✅"
    );

  } catch (err) {
    console.error(err);
    setStatus("err", "Сетевая ошибка: " + escapeHtml(err.message), "❗");
  } finally {
    btnSend.disabled = false;
  }
});

setDealHint("warn", "Введите ID сделки");
setStatus("warn", "Введите ID сделки", "⚠️");
</script>
