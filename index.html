<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выдача МИ в ЛУ</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    background: #f5f6f8;
    color: #222;
    max-width: 500px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 80px; }

  input#dealId.err {
    border-color: #e5484d;
    box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.15);
  }
  input#dealId.ok {
    border-color: #1db954;
    box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.15);
  }

  #dealHint {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.3;
    min-height: 16px;
    color: #666;
    white-space: pre-wrap;
  }
  #dealHint.err  { color: #b3261e; font-weight: 600; }
  #dealHint.ok   { color: #10622a; font-weight: 600; }
  #dealHint.warn { color: #7a5a00; }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: 600;
  }
  #btnPhoto { background: #2fc6f6; color: #fff; }
  #btnGallery { background: #7a8bff; color: #fff; }
  #btnSend { background: #1db954; color: #fff; }
  button:disabled { opacity: 0.6; }

  #photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .photo-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #e5e7eb;
    aspect-ratio: 1 / 1;
  }
  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-item .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    margin: 0;
    cursor: pointer;
    font-weight: 700;
  }
  #info { margin-top: 8px; font-size: 13px; color: #666; }

  #acceptRow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 12px;
    background: #fff;
    border: 1px solid #e0e2e6;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
  }
  #acceptRow input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: #f5a623;
    cursor: pointer;
    margin: 0;
  }
  #acceptRow.busy { opacity: 0.6; pointer-events: none; }

  #statusBox {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.4;
  }
  #statusBox.show { display: flex; }
  #statusBox.ok   { background: #d4f5dd; color: #10622a; }
  #statusBox.err  { background: #fad4d4; color: #7a1414; }
  #statusBox.warn { background: #fff3cd; color: #7a5a00; }

  #statusIcon {
    font-size: 28px;
    line-height: 1;
    flex: 0 0 auto;
    margin-top: -2px;
  }
  #statusText { white-space: pre-wrap; flex: 1; }

  .yes { color: #1db954; font-weight: 700; }
  .no  { color: #8a8f98; }
</style>
</head>
<body>

<h1>Выдача МИ в ЛУ</h1>

<label for="dealId">ID сделки</label>
<input type="text" id="dealId" inputmode="numeric" placeholder="Например: 12345">
<div id="dealHint"></div>

<div id="appBody">

  <button id="btnPhoto" type="button">📷 Сделать фото</button>
  <button id="btnGallery" type="button">🖼 Выбрать из галереи</button>
  <div id="photos"></div>
  <div id="info"></div>

  <label for="comment">Комментарий</label>
  <textarea id="comment" placeholder="Введите текст комментария"></textarea>

  <label id="acceptRow" for="acceptCheck">
    <input type="checkbox" id="acceptCheck">
    <span>МИ принято</span>
  </label>

  <button id="btnSend" type="button">Отправить в Битрикс24</button>

</div>

<div id="statusBox">
  <div id="statusIcon"></div>
  <div id="statusText"></div>
</div>

<script>
// ==== НАСТРОЙКИ ====
const WEBHOOK = "https://b24-964ige.bitrix24.ru/rest/1/0v15olo1zki4ls1k/";
const PORTAL = "https://b24-964ige.bitrix24.ru";
const MANAGER_ID = "1";
const MAX_SIZE = 300 * 1024;
const MAX_PHOTOS = 3;
const FIXED_PHRASE = "Выдача МИ в ЛУ";
const ACCEPT_FIELD = "UF_CRM_1791016249";

const CATEGORY_ID    = 12;
const REQUIRED_STAGE = "C12:4";
const REQUIRED_STAGE_NAME = "Готово";
const NEXT_STAGE     = "C12:UC_3M5ZEE";

// ==== ЭЛЕМЕНТЫ ====
const $ = id => document.getElementById(id);
const dealIdEl = $("dealId");
const dealHint = $("dealHint");
const btnPhoto = $("btnPhoto");
const btnGallery = $("btnGallery");
const btnSend = $("btnSend");
const acceptRow = $("acceptRow");
const acceptCheck = $("acceptCheck");
const photosEl = $("photos");
const info = $("info");
const statusBox = $("statusBox");
const statusIcon = $("statusIcon");
const statusText = $("statusText");

let photos = [];
let isProcessing = false;
let isAcceptBusy = false;

let stageState = null;
let checkTimer = null;

// ==== ХЕЛПЕРЫ ====
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function acceptLine(isAccepted) {
  return isAccepted
    ? `МИ принято — <span class="yes">Да</span>`
    : `МИ принято — <span class="no">Нет</span>`;
}

function setStatus(kind, html, icon) {
  if (!html) {
    statusBox.className = "";
    statusText.innerHTML = "";
    statusIcon.textContent = "";
    return;
  }
  statusBox.className = "show " + kind;
  statusIcon.textContent = icon || (kind === "ok" ? "✅" : kind === "warn" ? "⚠️" : "❗");
  statusText.innerHTML = html;
}

function setDealHint(kind, text) {
  dealIdEl.classList.remove("ok", "err");
  dealHint.classList.remove("ok", "err", "warn");

  if (kind === "ok")   dealIdEl.classList.add("ok");
  if (kind === "err")  dealIdEl.classList.add("err");

  if (kind) dealHint.classList.add(kind);
  dealHint.textContent = text || "";
}

function resetForm() {
  photos = [];
  renderPhotos();
  info.textContent = "";
  $("comment").value = "";
  acceptCheck.checked = false;
}

// ==== ПРОВЕРКА СТАДИИ ====
async function fetchDeal(dealId) {
  const resp = await fetch(WEBHOOK + "crm.deal.get", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: dealId })
  });

  let data;
  try {
    data = await resp.json();
  } catch (e) {
    throw new Error("HTTP " + resp.status + " — ответ не JSON");
  }

  if (data.error) {
    console.error("crm.deal.get error:", data);
    throw new Error(data.error_description || data.error || ("HTTP " + resp.status));
  }

  return data.result;
}

const NOT_READY_MSG = `Сделка не находится на стадии «${REQUIRED_STAGE_NAME}»`;

async function checkStage(dealId) {
  if (!dealId) {
    stageState = null;
    setDealHint("warn", "Введите ID сделки");
    setStatus("warn", "Введите ID сделки", "⚠️");
    return;
  }

  setDealHint("warn", "Проверка стадии сделки…");
  setStatus("warn", "Проверка стадии сделки…", "⏳");

  try {
    const deal = await fetchDeal(dealId);
    const categoryId = Number(deal.CATEGORY_ID);
    const stageId = deal.STAGE_ID;

    if (categoryId !== CATEGORY_ID) {
      stageState = "fail";
      const msg = `Сделка не в воронке 12 (CATEGORY_ID=${categoryId})`;
      setDealHint("err", msg);
      setStatus("err", escapeHtml(msg), "❗");
      return;
    }

    if (stageId !== REQUIRED_STAGE) {
      stageState = "fail";
      setDealHint("err", NOT_READY_MSG);
      setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
      return;
    }

    stageState = "ok";
    acceptCheck.checked = false;

    setDealHint("ok", `Стадия «${REQUIRED_STAGE_NAME}»`);
    setStatus(
      "ok",
      `Сделка на стадии «${REQUIRED_STAGE_NAME}». Можно заполнять и отправлять.<br>${acceptLine(false)}`,
      "✅"
    );

  } catch (e) {
    stageState = "fail";
    setDealHint("err", "Ошибка: " + e.message);
    setStatus("err", "Ошибка проверки сделки: " + escapeHtml(e.message), "❗");
  }
}

dealIdEl.addEventListener("input", () => {
  stageState = null;
  setDealHint(null, "");
  setStatus("warn", "Введите ID сделки", "⚠️");

  if (checkTimer) clearTimeout(checkTimer);
  const id = dealIdEl.value.trim();
  if (!id) {
    setDealHint("warn", "Введите ID сделки");
    return;
  }

  checkTimer = setTimeout(() => checkStage(id), 700);
});

// ==== ФЛАЖОК «МИ ПРИНЯТО» ====
acceptCheck.addEventListener("change", async () => {
  const dealId = dealIdEl.value.trim();
  if (!dealId) {
    acceptCheck.checked = false;
    setStatus("warn", "Укажите ID сделки", "⚠️");
    return;
  }

  if (stageState !== "ok") {
    acceptCheck.checked = false;
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (isAcceptBusy) return;

  isAcceptBusy = true;
  acceptRow.classList.add("busy");
  setStatus("warn", "Обновление поля «МИ принято»…", "⏳");

  const value = acceptCheck.checked ? 1 : 0;

  try {
    const resp = await fetch(WEBHOOK + "crm.deal.update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: dealId,
        fields: { [ACCEPT_FIELD]: value }
      })
    });
    const data = await resp.json();
    if (data.error) {
      console.error("crm.deal.update (accept) error:", data);
      acceptCheck.checked = false;
      setStatus("err", "Ошибка Битрикс24: " + escapeHtml(data.error_description), "❗");
      return;
    }
    setStatus(
      "ok",
      `✅ Сделка ${escapeHtml(dealId)}<br>${acceptLine(acceptCheck.checked)}`,
      "✅"
    );
  } catch (err) {
    console.error(err);
    acceptCheck.checked = false;
    setStatus("err", "Сетевая ошибка: " + escapeHtml(err.message), "❗");
  } finally {
    isAcceptBusy = false;
    acceptRow.classList.remove("busy");
  }
});

// ==== ВЫБОР ФОТО ====
function pickPhoto(useCamera) {
  if (isProcessing) return;
  if (stageState !== "ok") {
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (photos.length >= MAX_PHOTOS) {
    info.textContent = `Достигнут лимит: ${MAX_PHOTOS} фото`;
    return;
  }

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment";
  input.style.display = "none";

  input.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
    if (!file) {
      input.remove();
      return;
    }

    isProcessing = true;
    btnPhoto.disabled = true;
    btnGallery.disabled = true;
    info.textContent = "Обработка фото...";

    try {
      const { base64, size, name } = await compressImage(file);
      photos.push({ base64, name, size });
      renderPhotos();
      info.textContent = `Добавлено: ${name}, ~${Math.round(size / 1024)} КБ. Всего: ${photos.length} из ${MAX_PHOTOS}`;
    } catch (err) {
      console.error(err);
      info.textContent = "Ошибка обработки фото: " + err.message;
    } finally {
      isProcessing = false;
      btnPhoto.disabled = false;
      btnGallery.disabled = false;
      input.remove();
    }
  });

  document.body.appendChild(input);
  input.click();
}

btnPhoto.addEventListener("click", () => pickPhoto(true));
btnGallery.addEventListener("click", () => pickPhoto(false));

function renderPhotos() {
  photosEl.innerHTML = "";
  photos.forEach((p, idx) => {
    const div = document.createElement("div");
    div.className = "photo-item";

    const img = document.createElement("img");
    img.src = "data:image/jpeg;base64," + p.base64;
    div.appendChild(img);

    const btn = document.createElement("button");
    btn.className = "remove";
    btn.type = "button";
    btn.textContent = "×";
    btn.title = "Удалить фото";
    btn.addEventListener("click", () => {
      photos.splice(idx, 1);
      renderPhotos();
      info.textContent = `Фото удалено. Осталось: ${photos.length} из ${MAX_PHOTOS}`;
    });
    div.appendChild(btn);

    photosEl.appendChild(div);
  });
}

function compressImage(file, maxSize = MAX_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        const MAX_DIM = 1600;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round(height * MAX_DIM / width);
            width = MAX_DIM;
          } else {
            width = Math.round(width * MAX_DIM / height);
            height = MAX_DIM;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);

        while (dataUrl.length * 0.75 > maxSize && quality > 0.2) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }

        const base64 = dataUrl.split(",")[1];
        const size = Math.round(base64.length * 0.75);
        const name = `photo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;

        resolve({ base64, size, name });
      };
      img.onerror = () => reject(new Error("Не удалось загрузить изображение"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.readAsDataURL(file);
  });
}

// ==== ОТПРАВКА ====
btnSend.addEventListener("click", async () => {
  const dealId = dealIdEl.value.trim();
  const comment = $("comment").value.trim();
  const accepted = acceptCheck.checked;

  if (stageState !== "ok") {
    setStatus("err", escapeHtml(NOT_READY_MSG), "❗");
    return;
  }
  if (!dealId) return setStatus("warn", "Укажите ID сделки", "⚠️");
  if (!comment && photos.length === 0) {
    return setStatus("warn", "Добавьте комментарий или хотя бы одно фото", "⚠️");
  }
  if (isProcessing) {
    return setStatus("warn", "Дождитесь окончания обработки фото", "⚠️");
  }

  btnSend.disabled = true;
  setStatus("warn", "Отправка...", "⏳");

  try {
    const fullComment = comment ? FIXED_PHRASE + "\n" + comment : FIXED_PHRASE;

    const fields = {
      ENTITY_TYPE: "deal",
      ENTITY_ID: dealId,
      COMMENT: fullComment
    };
    if (photos.length > 0) {
      fields.FILES = photos.map(p => [p.name, p.base64]);
    }

    const resp = await fetch(WEBHOOK + "crm.timeline.comment.add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: fields })
    });
    const data = await resp.json();
    if (data.error) {
      console.error("crm.timeline.comment.add error:", data);
      setStatus("err", "Ошибка Битрикс24: " + escapeHtml(data.error_description), "❗");
      return;
    }

    const dealLink = `${PORTAL}/crm/deal/details/${dealId}/`;
    let notifyNote = "";
    try {
      const notifyResp = await fetch(WEBHOOK + "im.message.add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          DIALOG_ID: MANAGER_ID,
          MESSAGE: `МИ выдано.\nСделка: ${dealLink}`,
          URL_PREVIEW: "Y"
        })
      });
      const notifyData = await notifyResp.json();
      if (notifyData.error) {
        notifyNote = `<br>⚠️ Уведомление не отправлено: ${escapeHtml(notifyData.error_description)}`;
      }
    } catch (e) {
      notifyNote = `<br>⚠️ Уведомление не отправлено: ${escapeHtml(e.message)}`;
    }

    let stageNote = "";
    try {
      const deal = await fetchDeal(dealId);
      if (Number(deal.CATEGORY_ID) === CATEGORY_ID && deal.STAGE_ID === REQUIRED_STAGE) {
        const upd = await fetch(WEBHOOK + "crm.deal.update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: dealId,
            fields: { STAGE_ID: NEXT_STAGE }
          })
        });
        const updData = await upd.json();
        if (updData.error) {
          stageNote = `<br>⚠️ Не удалось изменить стадию: ${escapeHtml(updData.error_description)}`;
        } else {
          stageNote = `<br>Сделка переведена на стадию "На выдачу"`;
        }
      } else {
        stageNote = `<br>ℹ️ Стадия не изменена. ${escapeHtml(NOT_READY_MSG)}`;
      }
    } catch (e) {
      stageNote = `<br>⚠️ Не удалось изменить стадию: ${escapeHtml(e.message)}`;
    }

    resetForm();
    stageState = null;
    dealIdEl.value = "";
    setDealHint(null, "");
    setStatus(
      "ok",
      `✅ Комментарий добавлен в сделку ${escapeHtml(dealId)}` +
      `<br>${acceptLine(accepted)}` +
      notifyNote + stageNote,
      "✅"
    );

  } catch (err) {
    console.error(err);
    setStatus("err", "Сетевая ошибка: " + escapeHtml(err.message), "❗");
  } finally {
    btnSend.disabled = false;
  }
});

setDealHint("warn", "Введите ID сделки");
setStatus("warn", "Введите ID сделки", "⚠️");
</script>

</body>
</html>
